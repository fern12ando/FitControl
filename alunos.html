<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alunos — FitControl</title>
  <link rel="stylesheet" href="global.css" />
  <link rel="stylesheet" href="layout.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="responsive.css" />
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar"></aside>

    <div class="main-wrapper">
      <header class="topbar"></header>

      <main class="main-content">
        <div class="page-header">
          <div class="page-header-row">
            <div>
              <h1 class="page-title">Gerenciamento de Alunos</h1>
              <p class="page-subtitle">Cadastro completo, histórico de mensalidades e controle de acesso</p>
            </div>
            <button type="button" class="btn btn-primary" onclick="openModal('new-student-modal')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
              Cadastrar Aluno
            </button>
          </div>
        </div>

        <!-- Barra de Ferramentas / Filtros -->
        <div class="card toolbar-card">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="student-search-input" class="form-input" placeholder="Buscar por nome, CPF ou telefone..." />
          </div>

          <div class="filter-actions">
            <select id="student-status-filter" class="form-select" style="min-width: 160px;">
              <option value="TODOS">Todos os Status</option>
              <option value="ATIVO">Somente Ativos</option>
              <option value="SUSPENSO">Suspensos</option>
              <option value="INATIVO">Inativos</option>
            </select>
            <span class="badge badge-purple" id="students-count-badge">0 aluno(s)</span>
          </div>
        </div>

        <!-- Tabela de Alunos -->
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>Aluno</th>
                <th>CPF</th>
                <th>Telefone</th>
                <th>Plano Contratado</th>
                <th>Vencimento</th>
                <th>Status</th>
                <th class="text-right">Ações</th>
              </tr>
            </thead>
            <tbody id="students-table-body">
              <!-- Renderizado via students.js -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal: Cadastrar Novo Aluno -->
  <div id="new-student-modal" class="modal-overlay">
    <div class="modal-content modal-lg">
      <div class="modal-header">
        <h3 class="modal-title">Cadastrar Novo Aluno</h3>
        <button class="modal-close-btn" onclick="closeModal('new-student-modal')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="new-student-form" onsubmit="handleCreateStudent(event)">
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group col-span-2">
              <label class="form-label">Nome Completo <span class="required">*</span></label>
              <input type="text" id="new-student-name" class="form-input" required placeholder="Ex: Roberto Carlos da Silva" />
            </div>

            <div class="form-group">
              <label class="form-label">CPF (Validação Receita Federal) <span class="required">*</span></label>
              <input type="text" id="new-student-cpf" class="form-input" required placeholder="000.000.000-00" maxlength="14" />
            </div>

            <div class="form-group">
              <label class="form-label">Telefone / WhatsApp <span class="required">*</span></label>
              <input type="text" id="new-student-phone" class="form-input" required placeholder="(82) 99999-9999" maxlength="15" />
            </div>

            <div class="form-group">
              <label class="form-label">E-mail</label>
              <input type="email" id="new-student-email" class="form-input" placeholder="aluno@email.com" />
            </div>

            <div class="form-group">
              <label class="form-label">Data de Nascimento</label>
              <input type="date" id="new-student-birth" class="form-input" value="1995-01-01" />
            </div>

            <div class="form-group col-span-2">
              <label class="form-label">Plano de Matrícula <span class="required">*</span></label>
              <select id="new-student-plan" class="form-select" required></select>
            </div>

            <div class="form-group col-span-2">
              <label class="form-label">Endereço Residencial</label>
              <input type="text" id="new-student-address" class="form-input" placeholder="Rua, Número, Bairro, Maceió - AL" />
            </div>

            <div class="form-group">
              <label class="form-label">Contato de Emergência</label>
              <input type="text" id="new-student-emergency-name" class="form-input" placeholder="Ex: Maria (Esposa)" />
            </div>

            <div class="form-group">
              <label class="form-label">Telefone de Emergência</label>
              <input type="text" id="new-student-emergency-phone" class="form-input" placeholder="(82) 98888-0000" />
            </div>

            <div class="form-group col-span-2">
              <label class="form-label">Observações Médicas ou Treino</label>
              <textarea id="new-student-notes" class="form-textarea" placeholder="Restrições articulares, objetivos, etc..."></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('new-student-modal')">Cancelar</button>
          <button type="submit" class="btn btn-primary">Concluir Matrícula</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Perfil Detalhado do Aluno -->
  <div id="profile-modal" class="modal-overlay">
    <div class="modal-content modal-lg">
      <div class="modal-header">
        <h3 class="modal-title">Ficha Completa do Aluno</h3>
        <button class="modal-close-btn" onclick="closeModal('profile-modal')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="profile-modal-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('profile-modal')">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="storage.js"></script>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="ui.js"></script>
  <script src="navigation.js"></script>
  <script src="students.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fitAuth.enforcePageAccess(["PROPRIETARIO", "ADMINISTRADOR", "RECEPCIONISTA", "CONSULTA"]);
      setupNavigation("alunos", "Alunos");
      initStudentsPage();
    });
  </script>
</body>
</html>
